        .ping {
            --uib-size: 10rem;
            --uib-speed: 2s;
            --uib-color: #2196F3;
            position: relative;
            height: var(--uib-size);
            width: var(--uib-size);
        }

        .ping::before,
        .ping::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 100%;
            border-radius: 50%;
            background-color: var(--uib-color);
            animation: pulse7132 var(--uib-speed) linear infinite;
            transform: scale(0);
            opacity: 0;
        }

        .ping::after {
            animation-delay: calc(var(--uib-speed) / -2);
        }

        @keyframes pulse7132 {
            0% {
                transform: scale(0);
                opacity: 1;
            }

            100% {
                transform: scale(1);
                opacity: 0;
            }
        }

    <script type="text/javascript">

        // Load Awal

        `;

        // Nomor Salah

            <img src="https://ppobqita.my.id/assets/images/produk-eror.jpg" class="w-100 borad-5 shadow-sm">
            <p class="mt-3 f-16 fwb-6 op-7">Nomor yang dimasukan salah nih...</p>
        </div>
        `;

        // Produk Kosong
        const produkNone = `
        <div class="text-center animate__animated animate__fadeIn">
            <div class="p-4 bg-white borad-10 shadow-sm text-center">
                <img src="https://cdn-icons-png.flaticon.com/128/7486/7486744.png" class="mb-3" width="80">
                <p class="f-16 fwb-6 text-slate-800">Sepertinya kategori nominal bebas belum tersedia...</p>
                <p class="f-12 text-slate-500 mt-1">Harap hubungi admin untuk menambahkan produk dengan Kategori "NOMINAL BEBAS".</p>
            </div>
        </div>
        `;

        let dataTampilan = 0;
        let dataGambar = 0;
        let dataPencarian = 0;
        let dataProduk = null;
        let urutanProduk = "Termurah";
        let groupedProducts = {};
        let dataKategori = null;
        let dataDesc = null;
        let gambarKategori = null;
        let opera = "";

        // Setup Buttons Icons
        $("#imgContact").attr("src", iconPilihan[0].contact);
        $("#imgGaleri").attr("src", iconPilihan[0].imgscan);

        function getContact() {
            window.location.href = urlToko + "/ambil_kontak";
        }

        function getGaleri() {
            document.getElementById('fileInput').click();
            document.getElementById('fileInput').value = '';
            document.getElementById('ocrResult').innerHTML = '';
        }

        function previewImage(event) {
            document.getElementById('ocrResult').innerHTML = '';
            document.getElementById('ocrInfo').classList.remove('d-none');
            const file = event.target.files[0];
            const reader = new FileReader();

            reader.onload = function (e) {
                extractTextFromImage(e.target.result);
            };

            reader.readAsDataURL(file);
        }

        function extractTextFromImage(imageSrc) {
            Tesseract.recognize(
                imageSrc,
                'eng',
                { logger: (m) => console.log(m) }
            ).then(({ data: { text } }) => {
                displayPillButtons(text);
            }).catch(err => {
                console.error(err);
                document.getElementById('ocrResult').innerText = "OCR gagal dilakukan.";
            });
        }

        function displayPillButtons(text) {
            const ocrContainer = document.getElementById('ocrResult');
            ocrContainer.innerHTML = '';
            const regex = /\b\d{6,}(?:[-.\d]*)\b/g;
            const numbers = text.match(regex);

            if (numbers) {
                numbers.forEach(number => {
                    const pillButton = document.createElement('button');
                    pillButton.className = 'pill-button';
                    pillButton.innerText = number;
                    pillButton.onclick = () => insertToInput(number);
                    ocrContainer.appendChild(pillButton);
                });
            } else {
                ocrContainer.innerText = 'Tidak ada nomor yang ditemukan.';
            }

            document.getElementById('ocrInfo').classList.add('d-none');
        }

        function insertToInput(number) {
            const input = document.getElementById('nomoId');
            input.value = number;
            var event = new Event('change');
            input.dispatchEvent(event);
        }

        // Format nominal input (Rupiah formatting)
        $("#nominalId").on("input", function() {
            let val = $(this).val().replace(/\D/g, "");
            if (val === "") {
                $(this).val("");
            } else {
                let formatted = new Intl.NumberFormat("id-ID").format(parseInt(val));
                $(this).val("Rp " + formatted);
            }
        });

        // Search Kategori Modal input
        $("#searchKategori").on("input", function () {
            var value = $(this).val().toLowerCase();
            $("#isiPilihan .btn-add").filter(function () {
                $(this).toggle($(this).text().toLowerCase().indexOf(value) > -1);
            });
        });

        let dataSrcPil = 0;
        function rubahSrcPil() {
            if (dataSrcPil == 0) {
                dataSrcPil = 1;
                $("#iconSrcPil").html(`<i class="fa-solid fa-xmark"></i>`);
            } else {
                dataSrcPil = 0;
                $("#iconSrcPil").html(`<i class="fa-solid fa-magnifying-glass"></i>`);
                $("#searchKategori").val("");
                $("#isiPilihan .btn-add").show();
            }
        }

        // Load Operator
        function loadOperator(nama) {
            if (opera != nama) {
                if (nama == "SALAH") {
                    var dataSalah = $("#dataProduk").html();
                    $("#textTop").html("");

                    $("#imgTop").attr("src", iconPilihan[0].signal);
                    $("#imgTop").addClass("my-bg p-1");

                    $("#boxPilihan").addClass("d-none");

                    if (dataSalah != noSalah) {
                        $("#dataProduk").html(noSalah);
                    }
                } else {
                    var v = urlKategori[0][nama];

                    $("#textTop").html(v.nama);
                    $("#imgTop").attr("src", v.gambar);
                    $("#imgTop").removeClass("my-bg p-1");

                    fetchBebasProducts(v.category, v.gambar);
                }
                opera = nama;
            }
        }

        // Fetch & Load Data Bebas
        async function fetchBebasProducts(category, gambar) {
            gambarKategori = gambar;
            $("#dataProduk").html(loads);
            $("#boxPilihan").addClass("d-none");

            const action = 'products';
            const params = {
                category: category,
                membership: nama_membership,
                source: 'OkeConnect'
            };

            const sortedKeys = Object.keys(params).sort();
            const sortedParams = {};
            sortedKeys.forEach(key => {
                sortedParams[key] = params[key];
            });

            const queryString = new URLSearchParams(sortedParams).toString();
            let url = `${baseUrl}${action}&${queryString}`;

            $.ajax({
                url: url,
                type: 'GET',
                success: function (res) {
                    let data;
                    try {
                        data = typeof res === 'string' ? JSON.parse(res) : res;
                    } catch (e) {
                        console.error("Gagal memparsing JSON:", e, res);
                        resGetData([], "", 0);
                        return;
                    }

                    if (data && data.data && data.data.length > 0) {
                        groupedProducts = {};
                        let filteredProducts = data.data;

                        // Filter brands if specified
                        if (typeof filterBrands !== 'undefined' && filterBrands.length > 0) {
                            filteredProducts = filteredProducts.filter(p => {
                                const brandName = p.brand || '';
                                return filterBrands.some(fb => brandName.toLowerCase() === fb.toLowerCase());
                            });
                        }

                        // Exclude brands if specified
                        if (typeof excludeBrands !== 'undefined' && excludeBrands.length > 0) {
                            filteredProducts = filteredProducts.filter(p => {
                                const brandName = p.brand || '';
                                return !excludeBrands.some(eb => brandName.toLowerCase() === eb.toLowerCase());
                            });
                        }

                        // Group products by brand
                        filteredProducts.forEach(p => {
                            let brand = p.brand || "Lainnya";
                            if (!groupedProducts[brand]) groupedProducts[brand] = [];
                            groupedProducts[brand].push(p);
                        });

                        let categories = Object.keys(groupedProducts).map(brand => {
                            return { id_kategori: category, desc: brand, nama: brand };
                        });

                        $("#boxPilihan").removeClass("d-none");
                        loopCat(categories);
                    } else {
                        resGetData([], "", 0);
                    }
                },
                error: function (err) {
                    console.error("Gagal mengambil data", err);
                    resGetData([], "", 0);
                }
            });
        }

                for (const item of list) {

         function cekId(provider, no, zone = '') {
            // Tentukan kode e-wallet (e.g. dana, gopay, ovo, shopeepay, linkaja, isaku, grab, gopaydriver)
            // fallback menggunakan provider.kode atau mencocokkan kata kunci
            let ewalletCode = (provider.kode || '').toLowerCase().trim();
            if (ewalletCode === 'shopee' || ewalletCode === 'shopepay' || ewalletCode === 'shopeepay') {
                ewalletCode = 'shopeepay';
            } else if (ewalletCode === 'link') {
                ewalletCode = 'linkaja';
            }

            if (lastCheckedCode === ewalletCode && lastCheckedNo === no) {
                console.log("Pengecekan diabaikan karena provider dan nomor tujuan sama.");
                const cacheKey = `${ewalletCode}_${no}`;
                if (validationCache[cacheKey]) {
                    $("#nickname").html(validationCache[cacheKey]);
                }
                return;
            }
            lastCheckedCode = ewalletCode;
            lastCheckedNo = no;

            const cacheKey = `${ewalletCode}_${no}`;
            if (validationCache[cacheKey]) {
                console.log("Using cached validation result for key:", cacheKey);
                $("#nickname").html(validationCache[cacheKey]);
                return;
            }

            console.log("Cek ID Mitrascbo dengan", provider, no, zone);
            
            const url = `${mitrascboUrl}/trueid/ewallet/${ewalletCode}/?hp=${encodeURIComponent(no)}&key=${encodeURIComponent(mitrascboKey)}`;
            
            console.log("Hitting validation url:", url);
            
            fetch(url)
                .then(res => {
                    if (!res.ok) throw new Error("HTTP error " + res.status);
                    return res.json();
                })
                .then(data => {
                    console.log("Mitrascbo Response:", data);
                    
                    if (data && data.error_msg) {
                        $("#nickname").html(`<span class="text-danger">${data.error_msg}</span>`);
                        return;
                    }
                    
                    const name = data.name || data.nickname || (data.result && data.result.status === "200" ? "Berhasil (Nama tidak tersedia)" : null);
                    
                    if (name) {
                        const formattedName = decodeURIComponent(name).trim();
                        validationCache[cacheKey] = formattedName;
                        $("#nickname").html(formattedName);
                    } else {
                        $("#nickname").html("ID/Nomor tidak ditemukan...");
                    }
                })
                .catch(err => {
                    console.log("Validation Error:", err);
                    $("#nickname").html("Gagal cek ID / Gangguan...");
                });
        }

        async function prosesBeli(sku, adminFee) {
            const nominalStr = $("#nominalId").val() || "";
            const amountVal = parseInt(nominalStr.replace(/\D/g, "")) || 0;
            const no = $("#nomoId").val();

            if (!no) {
                Swal.fire({
                    icon: 'warning',
                    title: 'Tujuan Kosong',
                    text: 'Silahkan isi nomor tujuan / ID pelanggan terlebih dahulu!',
                });
                return;
            }

            if (amountVal < 10000 || amountVal > 1000000) {
                Swal.fire({
                    icon: 'error',
                    title: 'Nominal Tidak Valid',
                    text: 'Nominal transaksi harus berkisar antara Rp 10.000 dan Rp 1.000.000!',
                });
                return;
            }

            // Tutup modal detail jika terbuka agar tidak terjadi focus trapping pada input PIN
            var myOffcanvas = document.getElementById('detailCanv');
            var bsOffcanvas = bootstrap.Offcanvas.getInstance(myOffcanvas);
            if (bsOffcanvas) {
                bsOffcanvas.hide();
            }

            // Minta PIN Transaksi dari user
            const { value: pinUser } = await Swal.fire({
                title: 'PIN TRANSAKSI',
                html: `
                    <p class="f-12 text-muted mb-3">Silakan masukkan PIN Transaksi Anda untuk melanjutkan pembayaran.</p>
                    <input type="password" id="swal-pin-user" class="form-control text-center fwb-6 mb-3" 
                        placeholder="••••••" maxlength="6" inputmode="numeric" pattern="[0-9]*" 
                        style="font-size: 24px; letter-spacing: 10px; width: 200px; margin: 0 auto; border-radius: 8px;">
                    <p class="f-12 text-muted">Belum membuat PIN? <a href="${urlToko}/akun/?page=pin" target="_blank" style="color: #2196F3; font-weight: 600; text-decoration: underline;">Buat sekarang.</a></p>
                `,
                showCancelButton: true,
                cancelButtonText: 'Batal',
                confirmButtonText: 'Konfirmasi',
                confirmButtonColor: '#2196F3',
                focusConfirm: false,
                didOpen: () => {
                    setTimeout(() => {
                        const pinInput = document.getElementById('swal-pin-user');
                        if (pinInput) {
                            pinInput.focus();
                        }
                    }, 100);
                },
                preConfirm: () => {
                    const pin = document.getElementById('swal-pin-user').value;
                    if (!pin) {
                        Swal.showValidationMessage('PIN tidak boleh kosong!');
                        return false;
                    }
                    if (pin.length < 4) {
                        Swal.showValidationMessage('PIN minimal 4 digit!');
                        return false;
                    }
                    if (!/^\d+$/.test(pin)) {
                        Swal.showValidationMessage('PIN harus berupa angka!');
                        return false;
                    }
                    return pin;
                }
            });

            if (!pinUser) {
                return; // Batalkan transaksi jika user menekan batal
            }

            // Tampilkan loading animation
            Swal.fire({
                title: 'Sedang Memproses...',
                text: 'Mohon tunggu transaksi Anda sedang diproses.',
                allowOutsideClick: false,
                didOpen: () => {
                    Swal.showLoading();
                }
            });

            const action = 'transaction';
            const token = Math.random().toString(36).substring(2, 15);

            const bodyData = {
                buyer_sku_code: sku,
                customer_no: no,
                id_user: id_user,
                nama_user: nama_user,
                cmd: 'topup',
                membership: nama_membership,
                amount: amountVal,
                pin_user: pinUser
            };

            const payload = JSON.stringify(bodyData);
            const msgUint8 = new TextEncoder().encode(payload + "|" + action + "|" + token + ppobSecret);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgUint8);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const signature = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');

            fetch(`${baseUrl}${action}`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-Signature": signature,
                    "x-Token": token
                },
                body: payload
            })
            .then(res => res.json())
            .then(res => {
                console.log("Response:", res);

                // Tutup offcanvas
                var myOffcanvas = document.getElementById('detailCanv');
                var bsOffcanvas = bootstrap.Offcanvas.getInstance(myOffcanvas);
                if (bsOffcanvas) {
                    bsOffcanvas.hide();
                }

                if (res.data && res.data.ref_id) {
                    Swal.fire({
                        toast: true,
                        position: 'top-end',
                        icon: 'success',
                        title: 'Transaksi Berhasil!',
                        text: `ID Transaksi: ${res.data.ref_id}`,
                        showConfirmButton: false,
                        timer: 3000,
                        timerProgressBar: true
                    });

                    setTimeout(() => {
                        window.location.href = `${mainUrl}/script/detail.php?ref_id=${res.data.ref_id}&bukaolshop_shortcode=true`;
                    }, 400);

                } else {
                    Swal.fire({
                        icon: 'error',
                        title: 'Transaksi Gagal',
                        text: res.data ? res.data.message : (res.error || 'Terjadi kesalahan saat memproses transaksi.'),
                    });
                }
            })
            .catch(err => {
                console.error(err);
                Swal.fire({
                    icon: 'error',
                    title: 'Kesalahan Sistem',
                    text: 'Gagal terhubung ke server. Silakan coba kembali.',
                });
            });
        }

            if (offcanvasList.length > 0) {
                offcanvasList.forEach(function (el) {
                    var bsOffcanvas = bootstrap.Offcanvas.getInstance(el);
                    if (bsOffcanvas) {
                        bsOffcanvas.hide();
                    }
                });
            }
        });
    </script>
</body>

</html>
