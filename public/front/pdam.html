    <style>
        .ping {
            --uib-size: 10rem;
            --uib-speed: 2s;
            --uib-color: #2196F3;
            position: relative;
            height: var(--uib-size);
            width: var(--uib-size);
        }

        .ping::before,
        .ping::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 100%;
            border-radius: 50%;
            background-color: var(--uib-color);
            animation: pulse7132 var(--uib-speed) linear infinite;
            transform: scale(0);
            opacity: 0;
        }

        .ping::after {
            animation-delay: calc(var(--uib-speed) / -2);
        }

        @keyframes pulse7132 {
            0% {
                transform: scale(0);
                opacity: 1;
            }

            100% {
                transform: scale(1);
                opacity: 0;
            }
        }

    <script type="text/javascript">
        const id_user = '{{id_user}}';
        const nama_user = '{{nama_user}}';
        const nama_membership = '{{nama_membership}}';

        // Load Awal
        const loadAwal = `
        <div class="text-center mt-3 animate__animated animate__fadeIn">
        <p class="f-16 fwb-6 op-7">Masukkan ID Pelanggan terlebih dahulu...</p>
        </div>
        `;

        // Loader
        const loads = `
        <div class="d-flex justify-content-center py-5 align-items-center">
        <div class="ping"></div>
        </div>
        `;

        // Nomor Salah
        const noSalah = `
        <div class="text-center animate__animated animate__fadeIn">
        <img src="https://ppobqita.my.id/assets/images/produk-eror.jpg" class="w-100 borad-5 shadow-sm">
        <p class="mt-3 f-16 fwb-6 op-7">Nomor/ID Pelanggan yang dimasukkan salah...</p>
        </div>
        `;

        // Produk Kosong
        const produkNone = `
        <div class="text-center animate__animated animate__fadeIn">
        <img src="https://ppobqita.my.id/assets/images/produk-none.webp" class="w-100 borad-5 shadow-sm">
        <p class="mt-3 f-16 fwb-6 op-7">Sepertinya wilayah ini belum didukung...</p>
        </div>
        `;

        let allProduct = [];
        var data_page = 100;

        let dataTampilan = 0;
        let dataGambar = 0;
        let dataPencarian = 0;
        let dataProduk = null;
        let dataKategori = null;
        let gambarKategori = null;
        let dataDesc = null;
        let urutanProduk = "Termurah";
        let groupedProducts = {};
        let activeProductIndex = null;
        let pollInterval = null;
        let pollCount = 0;

        $("#imgContact").attr("src", iconPilihan[0].contact);
        $("#imgGaleri").attr("src", iconPilihan[0].imgscan);

        function getContact() {
            window.location.href = urlToko + "/ambil_kontak";
        }

        function getGaleri() {
            document.getElementById('fileInput').click();
            document.getElementById('fileInput').value = '';
            document.getElementById('ocrResult').innerHTML = '';
        }

        function previewImage(event) {
            document.getElementById('ocrResult').innerHTML = '';
            document.getElementById('ocrInfo').classList.remove('d-none');
            const file = event.target.files[0];
            const reader = new FileReader();

            reader.onload = function (e) {
                extractTextFromImage(e.target.result);
            };

            reader.readAsDataURL(file);
        }

        function extractTextFromImage(imageSrc) {
            Tesseract.recognize(
                imageSrc,
                'eng',
                {
                    logger: (m) => console.log(m)
                }
            ).then(({ data: { text } }) => {
                displayPillButtons(text);
            }).catch(err => {
                console.error(err);
                document.getElementById('ocrResult').innerText = "OCR gagal dilakukan.";
            });
        }

        function displayPillButtons(text) {
            const ocrContainer = document.getElementById('ocrResult');
            ocrContainer.innerHTML = '';

            const regex = /\b\d{2,}(?:[-.\d]*)\b/g;
            const numbers = text.match(regex);

            if (numbers) {
                numbers.forEach(number => {
                    const pillButton = document.createElement('button');
                    pillButton.className = 'pill-button';
                    pillButton.innerText = number;
                    pillButton.onclick = () => insertToInput(number);
                    ocrContainer.appendChild(pillButton);
                });
            } else {
                ocrContainer.innerText = 'Tidak ada ID Pelanggan yang terdeteksi.';
            }

            document.getElementById('ocrInfo').classList.add('d-none');
        }

        function insertToInput(number) {
            const input = document.getElementById('nomoId');
            input.value = number;
            var event = new Event('change');
            input.dispatchEvent(event);
        }

        function loopCat(data, gambar) {
            dataKategori = data;
            gambarKategori = gambar;
            $("#isiPilihan").html("");

            if (data.length <= 1) {
                $("#iconOperator").html("");
            } else {
                $("#iconOperator").html(`<i class="fa-solid fa-caret-down"></i>`);
            }
            $.each(data, function (i, v) {
                $("#isiPilihan").append(`
                    <button type="button" class="btn-add" id="btd-${i}" onclick="getData('${i}')" data-bs-dismiss="modal" role="button" tabindex="0" aria-label="${v.nama}" style="width: 100%; text-align: left; background: none;">${v.nama}</button>
                `);
            });

            defaultData();

            // JIKA HANYA ADA 1 KATEGORI/BRAND SETELAH DI-FILTER, OTOMATIS LOAD DATANYA TANPA PERLU POPUP
            if (data.length === 1) {
                getData('0');
                $("#modalKategori").modal("hide");
            } else if (data.length > 1) {
                $("#modalKategori").modal("show");
            }
        }

        function getData(i) {
            var id_kategori = dataKategori[i].id_kategori;
            var desc = dataKategori[i].desc;
            var nama = dataKategori[i].nama;
            var length = dataKategori.length;

            $("#dataProduk").html(loads);

            $("#textOperator").html(nama);
            $(".btn-add").removeClass("add-active");
            $("#btn-kat").addClass("poinz");
            $("#btd-" + i).addClass("add-active");
            $(".icon-pil").addClass("poinz");

            let products = groupedProducts[desc] || [];
            resGetData(products, desc, length);
        }

        function resGetData(data, desc, length) {
            $(".btn-pil").removeClass("poinz");
            $(".icon-pil").removeClass("poinz");
            if (data == null || data.length == 0) {
                $("#dataProduk").html(produkNone);
            } else {
                if (length == 1) {
                    $("#btn-kat").addClass("poinz");
                } else {
                    $("#btn-kat").removeClass("poinz");
                }
                let x;
                if (dataTampilan == 0) {
                    x = "d-grid-1";
                } else {
                    x = "d-grid-2";
                }
                $("#dataProduk").html(`<div class="animate__animated animate__fadeIn ${x}" id="isiProduk"></div>`);
                loopProduk(data, desc);

                dataProduk = data;
                dataDesc = desc;
            }
        }

        function loopProduk(data, desc) {
            if (data.length == 0) {
                $("#dataProduk").html(produkNone);
                return;
            }
            if (urutanProduk == "Termurah") {
                data.sort((a, b) => parseFloat(a.price) - parseFloat(b.price));
            } else if (urutanProduk == "Termahal") {
                data.sort((a, b) => parseFloat(b.price) - parseFloat(a.price));
            } else if (urutanProduk == "A-Z") {
                data.sort((a, b) => a.product_name.localeCompare(b.product_name));
            } else if (urutanProduk == "Z-A") {
                data.sort((a, b) => b.product_name.localeCompare(a.product_name));
            }
            $("#isiProduk").html("");

            let box, margin;
            if (dataTampilan == 0) {
                box = "box-list";
                margin = "me-3";
            } else {
                box = "box-grid";
                margin = "mb-3";
            }

            let block;
            if (dataGambar == 0) {
                block = "";
            } else {
                block = "d-none";
            }

            $.each(data, function () {

        async function doInquiry(sku, bayar_sku) {
            const action = 'transaction';
            const token = Math.random().toString(36).substring(2, 15);
            var no = $("#nomoId").val();

            if (!no) {
                Swal.fire({
                    icon: 'warning',
                    title: 'Masukkan ID Pelanggan',
                    text: 'Silakan isi ID pelanggan Anda terlebih dahulu!',
                });
                return;
            }

            // Ganti panel ke tampilan loader & pemrosesan
            $("#bodyCanv").html(`
                <div class="text-center py-5 animate__animated animate__fadeIn">
                    <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <p class="fwb-6 f-16 mt-3 text-primary mb-1">Menghubungi Server...</p>
                    <p class="op-7 f-12 mb-0">Memulai verifikasi ID Pelanggan ${no}</p>
                </div>
            `);

            // bodyData dengan cmd: 'inquiry' untuk mencegah saldo dipotong
            const bodyData = {
                buyer_sku_code: sku,
                customer_no: no,
                id_user: id_user,
                nama_user: nama_user,
                cmd: 'inquiry',
                membership: nama_membership,
                source: 'OkeConnect'
            };

            const payload = JSON.stringify(bodyData);
            const msgUint8 = new TextEncoder().encode(payload + "|" + action + "|" + token + ppobSecret);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgUint8);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const signature = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');

            fetch(`${baseUrl}${action}`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-Signature": signature,
                    "x-Token": token
                },
                body: payload
            })
            .then(res => res.json())
            .then(res => {
                console.log("Inquiry response:", res);

                if (res.data && res.data.ref_id) {
                    const ref_id = res.data.ref_id;
                    // Lakukan polling status secara otomatis
                    startStatusPolling(ref_id, sku, bayar_sku, no);
                } else {
                    Swal.fire({
                        icon: 'error',
                        title: 'Inquiry Gagal',
                        text: res.error || (res.data ? res.data.message : 'Silakan pastikan ID Pelanggan didukung dan coba kembali.'),
                    });
                    nextDetail(activeProductIndex);
                }
            })
            .catch(err => {
                console.error(err);
                Swal.fire({
                    icon: 'error',
                    title: 'Kesalahan Jaringan',
                    text: 'Gagal menghubungi server untuk verifikasi tagihan.',
                });
                nextDetail(activeProductIndex);
            });
        }

        function startStatusPolling(ref_id, sku, bayar_sku, no) {
            pollCount = 0;
            if (pollInterval) clearInterval(pollInterval);

            // Update loader step
            $("#bodyCanv").html(`
                <div class="text-center py-5 animate__animated animate__fadeIn">
                    <div class="spinner-border text-info" role="status" style="width: 3.5rem; height: 3.5rem;">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <p class="fwb-6 f-16 mt-3 text-info mb-1" id="poll-info">Pengecekan Tagihan (Detik 0)...</p>
                    <p class="op-7 f-12 mb-0">Sedang mengambil data tagihan dari pusat provider daerah Anda.</p>
                </div>
            `);

            async function checkStatus() {
                pollCount++;
                $("#poll-info").html(`Mengambil Data Tagihan (${pollCount})...`);

                if (pollCount > 12) { // Max 12 kali (48 detik)
                    clearInterval(pollInterval);
                    showFinalResult({
                        status: 'Pending',
                        message: 'Pencarian tagihan membutuhkan waktu lebih lama. Silakan ulangi Transaksi.',
                        sn: '',
                        sku: sku,
                        bayar_sku: bayar_sku,
                        no: no,
                        ref_id: ref_id
                    });
                    return;
                }

                // Polling status menggunakan action=trx&ref_id=xx yang sudah didefinisikan di PHP
                fetch(`${baseUrl}trx&ref_id=${ref_id}`)
                .then(res => res.json())
                .then(res => {
                    console.log("Polling status update:", res);
                    if (res.data && res.data.length > 0) {
                        const tx = res.data[0];
                        const status = tx.status;
                        const message = tx.message || '';
                        const sn = tx.sn || '';
                        const ttag = formatRupiah(tx.price || 0);

                        if (status === 'Sukses') {
                            clearInterval(pollInterval);
                            showFinalResult({
                                status: 'Sukses',
                                message: message,
                                sn: sn,
                                sku: sku,
                                bayar_sku: bayar_sku,
                                no: no,
                                customer_name: tx.customer_name,
                                price: ttag,
                                ref_id: ref_id
                            });
                        } else if (status === 'Gagal') {
                            clearInterval(pollInterval);
                            showFinalResult({
                                status: 'Gagal',
                                message: message,
                                sn: sn,
                                sku: sku,
                                bayar_sku: bayar_sku,
                                no: no,
                                ref_id: ref_id
                            });
                        }
                    }
                })
                .catch(err => {
                    console.error("Gagal melakukan status poll:", err);
                });
            }

            // Jalankan polling setiap 4 detik
            checkStatus();
            pollInterval = setInterval(checkStatus, 4000);
        }

        function rubahUrutanData(sortir, dataProduk) {
            let urutan;
            if (sortir == "Termurah") {
                urutan = dataProduk.sort(function (a, b) {
                    var murah = parseInt(a.price);
                    var mahal = parseInt(b.price);
                    return murah - mahal;
                });
            } else {
                if (sortir == 'Termahal') {
                    urutan = dataProduk.sort(function (a, b) {
                        var murah = parseInt(a.price);
                        var mahal = parseInt(b.price);
                        return mahal - murah;
                    });
                } else {
                    if (sortir == 'A-Z') {
                        urutan = dataProduk.sort(function (a, b) {
                            var awal = a.product_name.toUpperCase();
                            var akhir = b.product_name.toUpperCase();
                            return awal.localeCompare(akhir);
                        });
                    } else if (sortir == "Z-A") {
                        urutan = dataProduk.sort(function (a, b) {
                            var awal = a.product_name.toUpperCase();
                            var akhir = b.product_name.toUpperCase();
                            return akhir.localeCompare(awal);
                        });
                    }
                }
            }
            return urutan;
        }

        async function fetchDataProducts(category, gambar) {
            $("#dataProduk").html(loads);
            $("#boxPilihan").addClass("d-none");

            const action = 'products';
            const params = {
                category: category,
                membership: nama_membership,
                source: 'OkeConnect'
            };

            const sortedKeys = Object.keys(params).sort();
            const sortedParams = {};
            sortedKeys.forEach(key => {
                sortedParams[key] = params[key];
            });

            const queryString = new URLSearchParams(sortedParams).toString();
            let url = `${baseUrl}${action}&${queryString}`;

            $.ajax({
                url: url,
                type: 'GET',
                success: function (res) {
                    let data;
                    try {
                        data = typeof res === 'string' ? JSON.parse(res) : res;
                    } catch (e) {
                        console.error("Gagal memparsing JSON:", e, res);
                        resGetData([], "", 0);
                        return;
                    }

                    if (data && data.data && data.data.length > 0) {
                        groupedProducts = {};

                        // FILTER DI SINI: HANYA TAMPILKAN PRODUK YANG NAMANYA CEK
                        let filteredProducts = data.data.filter(p => {
                            const nameLower = (p.product_name || '').toLowerCase();
                            return nameLower.startsWith('cek') || nameLower.includes('cek');
                        });

                        // Ambil SKU untuk bayar dari produk yang namanya sama tapi awalannya BAYAR
                        filteredProducts.forEach(p => {
                            const nameLower = (p.product_name || '').trim().toLowerCase();
                            let suffix = '';
                            if (nameLower.startsWith('cek ')) {
                                suffix = nameLower.substring(4).trim();
                            } else {
                                suffix = nameLower.replace(/\bcek\b/gi, '').trim();
                            }

                            let bayarProduct = data.data.find(dp => {
                                const dpNameLower = (dp.product_name || '').trim().toLowerCase();
                                if (dpNameLower.startsWith('bayar ')) {
                                    const dpSuffix = dpNameLower.substring(6).trim();
                                    return dpSuffix === suffix;
                                }
                                return false;
                            });

                            if (!bayarProduct) {
                                const cleanSuffix = suffix.replace(/\s+/g, ' ');
                                bayarProduct = data.data.find(dp => {
                                    const dpNameLower = (dp.product_name || '').trim().toLowerCase().replace(/\s+/g, ' ');
                                    if (dpNameLower.startsWith('bayar ')) {
                                        const dpSuffix = dpNameLower.substring(6).trim();
                                        return dpSuffix === cleanSuffix || dpSuffix.includes(cleanSuffix) || cleanSuffix.includes(dpSuffix);
                                    }
                                    return false;
                                });
                            }

                            if (!bayarProduct) {
                                bayarProduct = data.data.find(dp => {
                                    const dpNameLower = (dp.product_name || '').toLowerCase();
                                    return dpNameLower.startsWith('bayar') && dpNameLower.includes(suffix);
                                });
                            }

                            p.bayar_sku_code = bayarProduct ? bayarProduct.buyer_sku_code : p.buyer_sku_code;
                        });

                        // 1. FILTER BERDASARKAN BRAND JIKA DIKONFIGURASI UTK MEMBATASI KATEGORI YANG MUNCUL (WHITELIST)
                        if (typeof filterBrands !== 'undefined' && filterBrands.length > 0) {
                            filteredProducts = filteredProducts.filter(p => {
                                const brandName = p.brand || '';
                                return filterBrands.some(fb => brandName.toLowerCase() === fb.toLowerCase());
                            });
                        }

                        // 2. FILTER BRAND BERDASARKAN KATA YANG DIKECUALIKAN (BLACKLIST EXCLUSION)
                        if (typeof excludeBrands !== 'undefined' && excludeBrands.length > 0) {
                            filteredProducts = filteredProducts.filter(p => {
                                const brandName = (p.brand || '').toLowerCase();
                                return !excludeBrands.some(eb => brandName.includes(eb.toLowerCase()));
                            });
                        }

                        filteredProducts.forEach(p => {
                            let brand = p.brand || "Lainnya";
                            if (!groupedProducts[brand]) groupedProducts[brand] = [];
                            groupedProducts[brand].push(p);
                        });

                        let categories = Object.keys(groupedProducts).map(brand => {
                            return { id_kategori: category, desc: brand, nama: brand };
                        });

                        $("#boxPilihan").removeClass("d-none");
                        loopCat(categories, gambar);
                    } else {
                        resGetData([], "", 0);
                    }
                },
                error: function (err) {
                    console.error("Gagal mengambil data", err);
                    resGetData([], "", 0);
                }
            });
        }

        function formatRupiah(angka) {
            var formatter = new Intl.NumberFormat("id-ID", {
                style: "currency",
                currency: "IDR",
                minimumFractionDigits: 0,
            });

            return formatter.format(angka).replace(/IDR/g, "Rp ");
        }

        //------------- START SISTEM -------------//

        defaultData();
        clearData();
        loadOperator("PDAM");

        $(document).ready(function () {
            // delay 500ms setelah halaman siap, lalu tampilkan modal kategori jika ada pilihan lebih dari satu
            setTimeout(function () {
                if (dataKategori === null || (dataKategori && dataKategori.length > 1)) {
                    $("#modalKategori").modal("show");
                }
            }, 500);
            $(".btn-add").removeClass("add-active");
            $("#textOperator").html("Pilih Wilayah PDAM");
        });

        //------------- END SISTEM -------------//

        $(".offcanvas").on("show.bs.offcanvas", function () {
            isBackButtonPressed = false;
            window.history.pushState({ offcanvas: true }, "");
        });

        $(".offcanvas").on("hide.bs.offcanvas", function (e) {
            if (!isBackButtonPressed) {
                window.history.back();
            }
            if (pollInterval) clearInterval(pollInterval); // Stop polling if closed
            isBackButtonPressed = false;
        });

        window.addEventListener("popstate", function (event) {
            isBackButtonPressed = true;
            var offcanvasList = document.querySelectorAll(".offcanvas.show");
            if (offcanvasList.length > 0) {
                offcanvasList.forEach(function (el) {
                    var bsOffcanvas = bootstrap.Offcanvas.getInstance(el);
                    if (bsOffcanvas) {
                        bsOffcanvas.hide();
                    }
                    if (pollInterval) clearInterval(pollInterval);
                });
            }
        });

    </script>
</body>
